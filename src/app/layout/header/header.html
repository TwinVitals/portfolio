<div class="bar container">
  <a class="brand" href="#home" (click)="closeMenu()">
    <span class="mark" aria-hidden="true">NK</span>
    <span>{{ profile.name }}</span>
  </a>

  <nav class="nav" aria-label="Primary">
    <ul>
      @for (item of navItems; track item.id) {
        <li>
          <a [href]="'#' + item.id" [class.active]="activeSection() === item.id"
             [attr.aria-current]="activeSection() === item.id ? 'true' : null">{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>

  <div class="actions">
    <a class="icon-link" [href]="profile.linkedin.href" target="_blank" rel="noopener" aria-label="LinkedIn profile">
      <app-icon name="linkedin" [size]="17" />
    </a>
    <a class="icon-link" [href]="profile.github.href" target="_blank" rel="noopener" aria-label="GitHub profile">
      <app-icon name="github" [size]="18" />
    </a>
    <a class="btn btn-secondary btn-sm resume" [href]="profile.resumeUrl" download>
      <app-icon name="download" [size]="16" />
      Download Resume
    </a>
  </div>

  <app-theme-toggle class="theme-toggle" />

  <button class="menu-toggle" type="button" (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu"
          [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'">
    <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="22" />
  </button>
</div>

<div id="mobile-menu" class="mobile-menu" [class.open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
  <nav class="container" aria-label="Mobile">
    <ul>
      @for (item of navItems; track item.id) {
        <li><a [href]="'#' + item.id" (click)="closeMenu()">{{ item.label }}</a></li>
      }
    </ul>
    <div class="mobile-actions">
      <a class="btn btn-primary" [href]="profile.resumeUrl" download (click)="closeMenu()">
        <app-icon name="download" [size]="16" />
        Download Resume
      </a>
      <div class="mobile-social">
        <a class="icon-link" [href]="profile.linkedin.href" target="_blank" rel="noopener" aria-label="LinkedIn profile">
          <app-icon name="linkedin" [size]="18" />
        </a>
        <a class="icon-link" [href]="profile.github.href" target="_blank" rel="noopener" aria-label="GitHub profile">
          <app-icon name="github" [size]="19" />
        </a>
      </div>
    </div>
  </nav>
</div>
