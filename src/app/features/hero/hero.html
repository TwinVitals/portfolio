<div class="backdrop" aria-hidden="true"></div>

<div class="container content">
  <div class="text">
    <p class="status">
      <span class="dot" aria-hidden="true"></span>
      {{ profile.currentRole }}
    </p>

    <p class="name">{{ profile.name }} <span class="sep" aria-hidden="true">·</span> <span class="spec">{{ profile.specialization }}</span></p>

    <h1 id="hero-title">{{ profile.headline }}</h1>

    <p class="intro">{{ profile.intro }}</p>

    <ul class="chips" aria-label="Core technologies">
      @for (skill of profile.heroSkills; track skill) {
        <li class="chip">{{ skill }}</li>
      }
    </ul>

    <div class="cta">
      <a class="btn btn-primary" href="#experience">
        View Experience
        <app-icon name="arrow-right" [size]="16" />
      </a>
      <a class="btn btn-secondary" href="#contact">Contact Me</a>
    </div>
  </div>

  <figure class="portrait">
    @if (profile.photo; as photo) {
      <img [src]="photo.src" [alt]="photo.alt" width="640" height="800" fetchpriority="high" decoding="async" />
    } @else {
      <!-- Photo placeholder: set `photo` in src/app/data/profile.ts to show the real headshot. -->
      <div class="placeholder" role="img" [attr.aria-label]="profile.name">
        <span>NK</span>
      </div>
    }
  </figure>
</div>
